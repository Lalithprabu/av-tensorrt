<text x="40" y="44" fill="#e6edf3" font-size="21" font-weight="700">YOLOv8 looks at every frame on three grids</text>
<text x="40" y="74" fill="#9198a1" font-size="14.5">The same distant pedestrian (about 16 × 40 px) lands on 18 cells of the finest grid but only 2 of the coarsest.</text>
<text x="40" y="96" fill="#9198a1" font-size="14.5">Small, distant objects depend on the fine grid, so that branch is the first suspect when INT8 costs accuracy.</text>
